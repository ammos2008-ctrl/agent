<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Найди пару</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 18px;
    padding: 24px 16px;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: radial-gradient(circle at 20% 15%, #2b2f4a 0%, #14161f 45%, #0b0c11 100%);
    color: #eef0f6;
    -webkit-tap-highlight-color: transparent;
  }

  h1 {
    font-size: 22px;
    font-weight: 650;
    letter-spacing: .2px;
  }

  .hud {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    justify-content: center;
    font-size: 13px;
  }

  .chip {
    background: rgba(255,255,255,.07);
    border: 1px solid rgba(255,255,255,.10);
    padding: 7px 13px;
    border-radius: 999px;
    display: flex;
    align-items: center;
    gap: 7px;
  }

  .chip b { font-variant-numeric: tabular-nums; font-weight: 650; }

  .board {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 10px;
    width: min(92vw, 420px);
  }

  .card {
    position: relative;
    aspect-ratio: 1 / 1;
    border: none;
    padding: 0;
    background: transparent;
    cursor: pointer;
    perspective: 700px;
    border-radius: 14px;
  }

  .card:disabled { cursor: default; }

  .inner {
    position: absolute;
    inset: 0;
    transform-style: preserve-3d;
    transition: transform .38s cubic-bezier(.4,.1,.2,1);
    border-radius: 14px;
  }

  .card.flipped .inner,
  .card.matched .inner { transform: rotateY(180deg); }

  .face {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 14px;
    backface-visibility: hidden;
    -webkit-backface-visibility: hidden;
    font-size: clamp(24px, 8vw, 36px);
    user-select: none;
  }

  .back {
    background: linear-gradient(145deg, #3d4470, #262b47);
    border: 1px solid rgba(255,255,255,.13);
    box-shadow: inset 0 1px 0 rgba(255,255,255,.14);
    color: rgba(255,255,255,.28);
    font-size: 20px;
  }

  .front {
    background: linear-gradient(145deg, #f7f8fc, #dfe3f0);
    border: 1px solid rgba(255,255,255,.5);
    transform: rotateY(180deg);
  }

  .card.matched .front {
    background: linear-gradient(145deg, #b8f2d0, #86e0b2);
    box-shadow: 0 0 0 2px rgba(120,230,180,.45), 0 0 22px rgba(90,220,160,.35);
  }

  .card:not(:disabled):hover .inner { transform: scale(1.035); }
  .card.flipped:not(:disabled):hover .inner,
  .card.matched:hover .inner { transform: rotateY(180deg); }

  .msg {
    font-size: 14px;
    min-height: 22px;
    color: #a9b0c9;
    text-align: center;
  }

  .msg.win { color: #7de8b4; font-weight: 600; }

  .btn {
    border: 1px solid rgba(255,255,255,.16);
    background: rgba(255,255,255,.09);
    color: #eef0f6;
    padding: 11px 22px;
    border-radius: 12px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: background .15s, transform .1s;
    font-family: inherit;
  }

  .btn:hover { background: rgba(255,255,255,.16); }
  .btn:active { transform: scale(.97); }

  .hint { font-size: 12px; color: #6d7590; text-align: center; max-width: 380px; line-height: 1.5; }
</style>
</head>
<body>

<h1>🃏 Найди пару</h1>

<div class="hud">
  <span class="chip">Ходы: <b id="moves">0</b></span>
  <span class="chip">Пары: <b id="pairs">0</b> / 8</span>
  <span class="chip">Время: <b id="time">0:00</b></span>
</div>

<div class="board" id="board" role="grid" aria-label="Игровое поле"></div>

<p class="msg" id="msg">Переворачивай по две карточки и ищи одинаковые эмодзи</p>

<button class="btn" id="restart">Новая игра</button>

<p class="hint">Совет: время идёт только после первого хода. Чем меньше ходов — тем лучше.</p>

<script>
  const SYMBOLS = ["🍕","🚀","🐙","🎧","🌙","🧊","🌵","🍩"];
  const boardEl  = document.getElementById("board");
  const movesEl  = document.getElementById("moves");
  const pairsEl  = document.getElementById("pairs");
  const timeEl   = document.getElementById("time");
  const msgEl    = document.getElementById("msg");
  const restart  = document.getElementById("restart");

  let deck = [], first = null, lock = false;
  let moves = 0, found = 0, started = false;
  let seconds = 0, timerId = null;

  function shuffle(arr) {
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  function fmt(s) {
    return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0");
  }

  function startTimer() {
    if (started) return;
    started = true;
    timerId = setInterval(() => {
      seconds++;
      timeEl.textContent = fmt(seconds);
    }, 1000);
  }

  function stopTimer() {
    clearInterval(timerId);
    timerId = null;
  }

  function buildBoard() {
    boardEl.innerHTML = "";
    deck.forEach((symbol, index) => {
      const card = document.createElement("button");
      card.className = "card";
      card.type = "button";
      card.dataset.symbol = symbol;
      card.dataset.index = index;
      card.setAttribute("aria-label", "Закрытая карточка");

      card.innerHTML =
        '<div class="inner">' +
          '<div class="face back">?</div>' +
          '<div class="face front">' + symbol + '</div>' +
        '</div>';

      card.addEventListener("click", () => flip(card));
      boardEl.appendChild(card);
    });
  }

  function flip(card) {
    if (lock) return;
    if (card === first) return;
    if (card.classList.contains("matched")) return;
    if (card.classList.contains("flipped")) return;

    startTimer();
    card.classList.add("flipped");
    card.setAttribute("aria-label", "Открытая карточка: " + card.dataset.symbol);

    if (!first) { first = card; return; }

    moves++;
    movesEl.textContent = moves;

    const second = card;

    if (first.dataset.symbol === second.dataset.symbol) {
      first.classList.add("matched");
      second.classList.add("matched");
      first.disabled = true;
      second.disabled = true;
      first = null;
      found++;
      pairsEl.textContent = found;

      if (found === SYMBOLS.length) win();
    } else {
      lock = true;
      const a = first, b = second;
      first = null;
      setTimeout(() => {
        a.classList.remove("flipped");
        b.classList.remove("flipped");
        a.setAttribute("aria-label", "Закрытая карточка");
        b.setAttribute("aria-label", "Закрытая карточка");
        lock = false;
      }, 850);
    }
  }

  function win() {
    stopTimer();
    msgEl.textContent = "🏆 Победа! " + moves + " ходов, " + fmt(seconds) + " времени";
    msgEl.classList.add("win");
  }

  function newGame() {
    stopTimer();
    deck = shuffle([...SYMBOLS, ...SYMBOLS]);
    first = null; lock = false;
    moves = 0; found = 0; started = false; seconds = 0;
    movesEl.textContent = "0";
    pairsEl.textContent = "0";
    timeEl.textContent = "0:00";
    msgEl.textContent = "Переворачивай по две карточки и ищи одинаковые эмодзи";
    msgEl.classList.remove("win");
    buildBoard();
  }

  restart.addEventListener("click", newGame);
  newGame();
</script>

</body>
</html>
